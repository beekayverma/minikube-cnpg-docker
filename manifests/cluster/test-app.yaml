apiVersion: v1
kind: Pod
metadata:
  name: test-app
  namespace: cnpg-test
spec:
  containers:
  - name: app
    image: postgres:17
    command: ["sleep", "infinity"]
    env:
    - name: PGHOST
      value: "pg-test-pooler-rw"
    - name: PGDATABASE
      value: "testdb"
    - name: PGSSLMODE
      value: "require"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    volumeMounts:
    - name: db-creds
      mountPath: /etc/db-creds
      readOnly: true
  volumes:
  - name: db-creds
    secret:
      secretName: pg-test-credentials
      defaultMode: 0600
