apiVersion: v1
kind: Pod
metadata:
  name: test-app
  namespace: cnpg-test
spec:
  containers:
  - name: app
    image: postgres:17
    command: ["sleep", "infinity"]
    env:
    - name: PGHOST
      value: "pg-test-rw"
    - name: PGDATABASE
      value: "testdb"
    - name: PGUSER
      valueFrom:
        secretKeyRef:
          name: pg-test-credentials
          key: username
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: pg-test-credentials
          key: password
    - name: PGSSLMODE
      value: "require"
