apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pg-test-pooler-ro
  namespace: cnpg-test
spec:
  cluster:
    name: pg-test
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "10"
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_connect_timeout: "15"
      server_login_retry: "15"
