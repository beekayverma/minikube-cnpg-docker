apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: cnpg-test
subjects:
- kind: ServiceAccount
  name: developer-sa
  namespace: cnpg-test
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-binding
  namespace: cnpg-test
subjects:
- kind: ServiceAccount
  name: app-sa
  namespace: cnpg-test
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
